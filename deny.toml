# cargo-deny configuration. Run locally with:
#   cargo install cargo-deny && cargo deny check
#
# See AGENTS.md. The point of this file is that a dependency change that
# introduces a vulnerable crate, an incompatible license, or a fourth copy of an
# already-vendored library is caught at review time rather than at release time.

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Add an advisory ID here only with a one-line reason and a date to revisit.
ignore = []

[licenses]
version = 2
# XDL is MIT (LICENSE). Crate license fields and SPDX headers are MIT too.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # Font licences used by egui's bundled fonts (epaint), via xdl-gui.
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
# Scientific FFI wrappers frequently sit on top of system libraries with their
# own terms; list the specific crate here rather than widening `allow`.
name = "ring"
allow = ["OpenSSL"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A second copy of a heavy dependency doubles build time and, for anything with
# global state, can produce two independent registries at runtime.
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
