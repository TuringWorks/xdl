name: Deploy GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Build the cargo API docs so they are deployed alongside the Jekyll site.
      # This is the publishing path the CI `docs` job gates on but does not
      # deploy — keeping a single deployer avoids Pages flapping between
      # branches.
      # Only public APIs are published (--no-deps, no --document-private-items)
      # to avoid leaking internal paths or implementation details to the public
      # site. If a crate with sensitive internals is added, scope the build
      # with an explicit --package list.
      # `RUSTDOCFLAGS: -D warnings` is NOT set here: rustdoc warnings have never
      # been enforced, so turning it on would ship a deploy that is red on
      # arrival. Enable it once the backlog is clear — same trigger as the CI
      # `docs` job.
      - name: Build API documentation
        run: cargo doc --workspace --no-deps

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./docs
          destination: ./_site

      - name: Add API docs to site
        # Let cp fail naturally if target/doc is missing — a silent deploy of
        # an incomplete site is worse than a visible build failure.
        run: |
          mkdir -p ./_site/api
          cp -r target/doc/. ./_site/api/
          echo "API docs copied to ./_site/api/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
