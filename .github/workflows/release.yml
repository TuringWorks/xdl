name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.2)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # A tag that disagrees with the source is the fastest way to publish a binary
  # nobody can reproduce. See AGENTS.md -> Change-Surface Cookbook -> Version bump.
  verify:
    name: Verify the tag matches the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions agree across Cargo.toml, tauri.conf.json, package.json
        run: ./scripts/check-version-sync.sh

      - name: Tag matches the workspace version
        env:
          # The tag is untrusted input: a workflow_dispatch user controls it
          # directly, and even pushed tag names may carry shell metacharacters.
          # It travels via env (never interpolated into this script) and is
          # gated on a strict release format before anything consumes it.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){2}$'; then
            echo "FAIL — '$TAG' is not a release tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          want="${TAG#v}"
          got=$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && $1=="version"{gsub(/[",]/,"",$3); print $3; exit}' Cargo.toml)
          echo "tag=$TAG  Cargo.toml=$got"
          if [ "$want" != "$got" ]; then
            echo "FAIL — tag $TAG does not match [workspace.package] version $got"
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the interpreter and the language server
        run: |
          cargo build --release --target ${{ matrix.target }} -p xdl-cli
          cargo build --release --target ${{ matrix.target }} -p xdl-lsp

      # Building is not shipping: confirm the binary that will be uploaded is the
      # one that was just built, and that it actually runs.
      # See AGENTS.md -> Prove the artifact carries the change.
      - name: Smoke-test the artifact (native targets only)
        if: matrix.target != 'aarch64-apple-darwin' || runner.arch == 'ARM64'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/xdl"
          [ "${{ matrix.os }}" = "windows-latest" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" -e 'print, findgen(5)'

      - name: Package
        shell: bash
        env:
          # Same trust boundary as the verify job: TAG may come from a dispatch
          # input, so validate the strict format here too before the value is
          # used in mkdir/cp/archive names (shell injection + path traversal).
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){2}$'; then
            echo "FAIL — '$TAG' is not a release tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          name="xdl-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/xdl.exe "dist/$name/"
            cp target/${{ matrix.target }}/release/xdl-lsp.exe "dist/$name/" 2>/dev/null || true
          else
            cp target/${{ matrix.target }}/release/xdl "dist/$name/"
            cp target/${{ matrix.target }}/release/xdl-lsp "dist/$name/" 2>/dev/null || true
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$name/" 2>/dev/null || true
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
          # A checksum is the only way a user can tell a mirrored artifact from a
          # substituted one.
          if command -v sha256sum >/dev/null; then
            sha256sum "$name."* > "$name.sha256"
          else
            shasum -a 256 "$name."* > "$name.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: xdl-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256